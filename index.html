<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family:'Courier New', Courier, monospace;
    font-weight:bold; color:#fff; text-transform:uppercase;
    -webkit-font-smoothing:none; cursor:default;
  }
  #crt {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 4 / 3));
    height:min(100vh, calc(100vw * 3 / 4));
    image-rendering:pixelated; background:#000;
  }
  .cornerlabel { position:fixed; top:14px; left:16px; font-size:12px; color:#2e2e2e; z-index:5; }
  #back {
    position:fixed; top:12px; right:16px; z-index:5;
    font-size:12px; color:#5a5a5a; text-decoration:none; letter-spacing:.1em;
  }
  #back:hover, #back:focus-visible { color:#ffff00; outline:none; }
  #keys {
    position:fixed; bottom:26px; left:0; right:0; z-index:5;
    text-align:center; font-size:11px; color:#2e2e2e; letter-spacing:.08em;
  }
  footer {
    position:fixed; bottom:6px; left:0; right:0; z-index:5;
    text-align:center; font-size:10px; color:#1c1c1c; letter-spacing:.08em;
  }
  footer a { color:#2e2e2e; text-decoration:none; }
  #failed {
    display:none; position:fixed; inset:0; z-index:60; background:#000;
    flex-direction:column; align-items:center; justify-content:center; gap:1.4rem;
    font-size:17px; text-align:center;
  }
  #failed a { color:#5a5a5a; text-decoration:none; }
  /* ---------- PRELUDE: the page you weren't supposed to find ---------- */
  #prelude{
    position:fixed; inset:0; z-index:100;
    background:#fff; color:#000;
    font-family:'Times New Roman', Times, serif;
    font-weight:normal; text-transform:none;
    padding:24px;
  }
  #prelude h1{ font-size:22px; font-weight:bold; margin-bottom:10px; }
  #prelude p{ font-size:15px; }
  #prelude a{ color:#00e; }

<body>
<!--
  ENTRY 00.

  THE MENU PRECEDES THE DEVICE.
  THE DEVICE PRECEDES THE DARKNESS.

  (three of the slots are lies.)
-->
<div id="prelude">
  <h1>Not Found</h1>
  <p>The requested device does not exist on this server.</p>
  <noscript>
    <p style="margin-top:14px">Without JavaScript the set will not come on, but the rooms are here:
    <a href="DEVICE_ROOM/">DEVICE_ROOM</a> &middot;
    <a href="DEVICE_KNIGHT/">DEVICE_KNIGHT</a> &middot;
    <a href="DEVICE_INDEX/">DEVICE_INDEX</a> &middot;
    <a href="DEVICE_CONTACT/">DEVICE_CONTACT</a></p>
  </noscript>
</div>

<!-- The corner label, key legend and footer are gone from THIS page by
     request — the boot is bare. The fan-project/attribution footer still
     ships on every other page of the site (the room, both sims, contact),
     which is where it needs to be; do not strip it from those. -->
<canvas id="crt" width="640" height="480"
        aria-label="A television booting up."></canvas>

<div id="failed">
  <p>* THE SCREEN DID NOT LOAD.</p>
  <a href="../">&larr; THE DEVICE</a>
</div>

<script type="module">
  import { runCrt } from './shared/crt.js?v=boot3';
  import { loadPrefs, savePrefs, applyPrefs } from './shared/device.js';

  const canvas = document.getElementById('crt');
  /* FILL THE DISPLAY, BARS ON THE SHORT AXIS — what the game does in
     fullscreen. The frame keeps its 4:3 and grows until one axis runs out,
     so a widescreen gets black down either side and nothing is cropped.

     This deliberately gives up whole-pixel scaling. At a fractional factor
     `image-rendering: pixelated` hands some source columns n device pixels
     and their neighbours n + 1, so a one-pixel stem is fat on one letter
     and thin on the next. The real game makes the same trade at the same
     place: filling the screen wins over an exact pixel grid. */
  function fit() {
    const f = Math.min(innerWidth / 640, innerHeight / 480);
    canvas.style.width = `${640 * f}px`;
    canvas.style.height = `${480 * f}px`;
  }
  addEventListener('resize', fit);
  fit();

  const prefs = loadPrefs();
  // The boot no longer asks its two questions. The stored preferences (and
  // their SAFE defaults — flicker effects off unless opted in, and
  // prefers-reduced-motion always honoured) still apply; they are just not
  // a gate any more.
  applyPrefs(prefs);

  /* THE SET COMES ON, AND THEN YOU WALK IN. */
  function go() {
    prefs.seenIntro = true;
    savePrefs(prefs);
    location.href = 'DEVICE_ROOM/';
  }

  window.addEventListener('keydown', (e) => {
    // X backs out of nothing here, but Z at any point is "get on with it".
    if (e.key.toLowerCase() === 'x') { e.preventDefault(); go(); }
  });

  // The 404 prelude holds a beat longer, and the set only comes ON when it
  // lifts — the scroller's frame clock must not run under the overlay, or
  // most of its time is spent invisible.
  const hold = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1250 : 1850;
  setTimeout(async () => {
    const p = document.getElementById('prelude');
    if (p) p.style.display = 'none';
    try {
      await runCrt(canvas, {
        fontBase: 'assets/gonermaker/',
        shader: 'assets/crt/shd_crt2.frag',
        // the cartridge-boot scroller: rows of the line drifting across
        // the set until Z is pressed — no timed advance.
        scroll: { text: 'BOOTING DEVICE_MENU . . .' },
        onConfirm: () => { go(); },
      });
    } catch (err) {
      console.error('crt failed:', err);
      document.getElementById('failed').style.display = 'flex';
    }
  }, hold);
</script>
</body>
</html>
