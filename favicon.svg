<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10" shape-rendering="crispEdges">
  <!-- The SOUL, 8x7 pixels, on the screen's black. Symmetric about x=4:
       both outer edges run y1..4, both sides step in one pixel per row,
       and the tip is the 2px run x3..5 — an even-width heart cannot land
       a 1px tip on centre. The old path's right edge stopped a row short
       and the whole heart leaned left. -->
  <rect width="10" height="10" fill="#000"/>
  <path fill="#ff0000" transform="translate(1,1.5)"
    d="M1 0h2v1h2V0h2v1h1v3h-1v1h-1v1h-1v1H3V6H2V5H1V4H0V1h1z"/>
</svg>
