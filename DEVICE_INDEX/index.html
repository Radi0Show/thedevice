<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVICE_INDEX</title>
<meta name="description" content="Every attack in the Roaring Knight fight, with practice links. Even the ones that were cut.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE DEVICE">
<meta property="og:title" content="DEVICE_INDEX">
<meta property="og:description" content="EVERY ATTACK. EVEN THE ONES THAT WERE CUT.">
<meta property="og:url" content="https://shadowcrystal.dev/DEVICE_INDEX/">
<meta property="og:image" content="https://shadowcrystal.dev/og/device.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shadowcrystal.dev/og/device.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/device.css">
<style>
  main { padding: 12vh 24px 6vh; max-width: 680px; margin: 0 auto; }
  .lede { margin-bottom: 44px; }
  h2 { font-size: 14px; color: #5a5a5a; letter-spacing: .1em; margin: 44px 0 14px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; color: #2e2e2e; font-size: 11px;
    padding: 4px 8px 4px 0; border-bottom: 1px solid #2e2e2e;
  }
  td { padding: 9px 8px 9px 0; border-bottom: 1px solid #141414; vertical-align: baseline; }
  td.name { color: #fff; font-size: 14px; }
  td.where { color: #5a5a5a; font-size: 12px; }
  td.practice { white-space: nowrap; text-align: right; }
  td.practice a {
    color: #5a5a5a; font-size: 12px; padding: 2px 7px;
    border: 1px solid #2e2e2e; text-decoration: none;
  }
  td.practice a:hover, td.practice a:focus-visible {
    color: #ffff00; border-color: #ffff00; outline: none;
  }
  td.practice a + a { margin-left: 5px; }
  .provenance { color: #2e2e2e; font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
<div class="cornerlabel">DEVICE_INDEX</div>

<main>
  <div class="voiceline lede" id="lede" aria-live="polite">* THE INDEX.
* EVERY ATTACK. EVEN THE ONES THAT WERE CUT.</div>

  <section>
    <h2>THE FIGHT</h2>
    <table id="fight-table">
      <thead><tr><th>ATTACK</th><th>WHERE</th><th>PRACTICE</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>UNUSED CONTENT</h2>
    <div class="voiceline dim" style="font-size:13px; margin-bottom:14px">* THE FIGHT NEVER SELECTS THEM.
* TRANSLATED AND LABELLED ANYWAY.</div>
    <table id="unused-table">
      <thead><tr><th>ATTACK</th><th>WHERE</th><th>PRACTICE</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <p class="provenance" id="provenance"></p>

</main>


<script type="module">
  import { applyPrefs, reduceMotion, typeInto, beat } from '../shared/device.js';
  applyPrefs();

  const lede = document.getElementById('lede');
  if (!reduceMotion) {
    (async () => {
      lede.textContent = '';
      await typeInto(lede, '* THE INDEX.');
      await beat(400);
      lede.textContent += '\n* EVERY ATTACK. EVEN THE ONES THAT WERE CUT.';
    })();
  }

  // THE ROSTER COMES FROM THE SIM ITSELF when it is connected — the same
  // module its title screen builds its picker from, so this page cannot
  // drift from what the simulator can actually launch. The checked-in
  // snapshot only carries the pre-merge state, and the provenance line
  // says which one you are looking at.
  let menu, provenance;
  try {
    ({ ATTACK_MENU: menu } = await import('../DEVICE_KNIGHT/sim/scenes/single.js'));
    provenance = '* ROSTER: LIVE — IMPORTED FROM THE SIMULATOR.';
  } catch {
    const snap = await import('../shared/attack-menu.snapshot.js');
    menu = snap.ATTACK_MENU;
    provenance = `* ROSTER: SNAPSHOT (${snap.SNAPSHOT_DATE}) — SIMULATOR NOT CONNECTED.`;
  }
  document.getElementById('provenance').textContent = provenance;

  // ?difficulty= takes the selector's RAW value (0/3/4 for the tunnel), not
  // the 1..N the sim's picker displays — same contract main.js reads. The
  // link text shows D1..DN like the picker; the href carries the raw value.
  function row(entry) {
    const tr = document.createElement('tr');
    const links = entry.difficulties.map((raw, i) =>
      `<a href="../DEVICE_KNIGHT/?mode=practice&attack=${encodeURIComponent(entry.id)}&difficulty=${raw}">D${i + 1}</a>`
    ).join('');
    tr.innerHTML =
      `<td class="name">${entry.name.toUpperCase()}</td>`
      + `<td class="where">${entry.unused ? 'NEVER SELECTED' : entry.where.toUpperCase()}</td>`
      + `<td class="practice">${links}</td>`;
    return tr;
  }
  const fight = document.querySelector('#fight-table tbody');
  const unused = document.querySelector('#unused-table tbody');
  for (const entry of menu) (entry.unused ? unused : fight).append(row(entry));
</script>
</body>
</html>
