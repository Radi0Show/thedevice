# Deploys the site to Cloudflare Pages on every push to main.
#
# This repo IS the site: index.html at the root, the sims vendored in by
# tools/vendor-*.sh and committed — so what was tested locally and on the
# GitHub Pages staging URL is byte-for-byte what ships. No build step.
#
# DORMANT until two repository secrets exist (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard's right sidebar
# and a Pages project named `shadowcrystal` exists on the account
# (Workers & Pages → Create → Pages → Direct Upload, name it, done —
# the first workflow run populates it). Custom domain: add
# shadowcrystal.dev under the project's Custom domains tab.
name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret — skipping deploy (GitHub Pages staging still updates)."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.have == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=shadowcrystal --commit-dirty=true
