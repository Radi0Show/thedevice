<!DOCTYPE html>
<html lang="en">
<!--
  ENTRY 00.

  THE MENU PRECEDES THE DEVICE.
  THE DEVICE PRECEDES THE DARKNESS.

  (three of the slots are lies.)
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVICE_GONERMAKER</title>
<meta name="description" content="Browser recreations of the DELTARUNE secret bosses. A fan project.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE DEVICE">
<meta property="og:title" content="THE DEVICE">
<meta property="og:description" content="Browser recreations of the DELTARUNE secret bosses. One is ready. The others have not arrived.">
<meta property="og:url" content="https://shadowcrystal.dev/DEVICE_GONERMAKER/">
<meta property="og:image" content="https://shadowcrystal.dev/og/device.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="THE DEVICE">
<meta name="twitter:description" content="Browser recreations of the DELTARUNE secret bosses.">
<meta name="twitter:image" content="https://shadowcrystal.dev/og/device.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/device.css">
<style>
  /* ---------- PRELUDE: the page you weren't supposed to find ---------- */
  #prelude{
    position:fixed; inset:0; z-index:100;
    background:#fff; color:#000;
    font-family:'Times New Roman', Times, serif;
    font-weight:normal; text-transform:none;
    padding:24px;
  }
  #prelude h1{ font-size:22px; font-weight:bold; margin-bottom:10px; }
  #prelude p{ font-size:15px; }
  #prelude a{ color:#00e; }

  /* ---------- THE INTERROGATION ----------
     A 320x240 room, exactly like the one the sequence runs in, scaled by a
     whole number of device pixels. `pixelated` at a fractional scale gives
     some source columns n device pixels and their neighbours n+1 — which is
     precisely how a 1px font stem ends up fat on one letter and thin on the
     next. The scale is computed in JS; this is the pre-script fallback. */
  #intro{ position:fixed; inset:0; background:#000; }

  #introCanvas{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 4 / 3));
    height:min(100vh, calc(100vw * 3 / 4));
    image-rendering:pixelated;
    background:#000;
  }

  #skipBtn{
    position:fixed; top:14px; right:16px; z-index:5;
    font-size:13px; color:#5a5a5a;
    background:none; border:none;
    font-family:inherit; font-weight:bold; text-transform:uppercase;
    cursor:pointer; padding:6px;
  }
  #skipBtn:hover, #skipBtn:focus-visible{ color:#ffff00; outline:none; }

  /* The one piece of chrome the game has no equivalent for: people need to
     know the keys before the first question. */
  #introKeys{
    position:fixed; bottom:12px; left:0; right:0; z-index:5;
    text-align:center; font-size:11px; color:#2e2e2e; letter-spacing:.08em;
  }
</style>
</head>
<body>

<div id="prelude">
  <h1>Not Found</h1>
  <p>The requested device does not exist on this server.</p>
  <noscript>
    <p style="margin-top:14px">Without JavaScript the sequence cannot speak, but the rooms are still here:
    <a href="../DEVICE_MENU/">DEVICE_MENU</a> ·
    <a href="../DEVICE_KNIGHT/">DEVICE_KNIGHT</a> ·
    <a href="../DEVICE_INDEX/">DEVICE_INDEX</a> ·
    <a href="../DEVICE_CONTACT/">DEVICE_CONTACT</a></p>
  </noscript>
</div>

<!-- ======================= THE INTERROGATION ======================= -->
<div id="intro">
  <button id="skipBtn" type="button">[ SKIP ]</button>
  <canvas id="introCanvas" width="320" height="240"
          aria-label="An opening sequence asks three questions. Arrow keys choose, Z confirms. Skip is in the top corner."></canvas>
  <div id="introKeys">&#9664; &#9654; CHOOSE &middot; [ Z ] CONFIRM &middot; HOLD [ X ] TO HASTEN</div>
</div>

<script type="module">
import { loadPrefs, savePrefs, applyPrefs, reduceMotion } from '../shared/device.js';
import { runIntro } from '../shared/gm-intro.js';

/* =====================================================================
   THE FRONT DOOR IS A SEQUENCE, AND IT LEADS SOMEWHERE.

   The interrogation asks its three questions and then hands over to
   DEVICE_MENU — the room with the television in it. The site itself lives
   in that television: you plug the controller in and it boots. So this
   page no longer holds a menu; it holds the thing that comes before one.
   ===================================================================== */

const store = loadPrefs();
applyPrefs(store);

const params = new URLSearchParams(location.search);
const reconfigure = params.get('reconfigure') === '1';

const introCanvas = document.getElementById('introCanvas');
let abortIntro = null;

/* An INTEGER scale, measured in DEVICE pixels — see the note in the style
   block. Below 1x there is no whole multiple to land on, so it falls back
   to filling: showing the whole frame slightly soft beats cropping it. */
function fitIntro(){
  const dpr = window.devicePixelRatio || 1;
  const fit = Math.min((window.innerWidth * dpr) / 320, (window.innerHeight * dpr) / 240);
  const scale = fit >= 1 ? Math.floor(fit) : fit;
  introCanvas.style.width = `${(320 * scale) / dpr}px`;
  introCanvas.style.height = `${(240 * scale) / dpr}px`;
}
window.addEventListener('resize', fitIntro);

/** Everything here ends the same way: in the room. */
function toRoom(){
  location.href = '../DEVICE_MENU/';
}

async function runInterrogation(){
  fitIntro();
  const io = {
    base: '../assets/gonermaker/',
    soundOn: store.soundOn,
    onSound: (on) => { store.soundOn = on; savePrefs(store); },
  };
  abortIntro = () => io.abort?.();
  let answers;
  try {
    answers = await runIntro(introCanvas, io);
  } catch (err) {
    // If the sequence cannot draw, a visitor should still reach the room
    // rather than sit on a black screen.
    console.error('the interrogation could not run:', err);
    answers = { photosensitive: true, soundOn: store.soundOn };
  }
  store.flickerOK = !answers.photosensitive && !reduceMotion;
  store.soundOn = answers.soundOn;
  store.seenIntro = true;
  savePrefs(store);
  applyPrefs(store);
  toRoom();
}

/* The button hands the abort to the running sequence, which fades out the
   way it would have anyway; sound is left as it was, which is on. */
document.getElementById('skipBtn').addEventListener('click', () => {
  if (abortIntro) { abortIntro(); return; }
  store.flickerOK = false;
  store.seenIntro = true;
  savePrefs(store);
  toRoom();
});

/* =====================================================================
   BOOT — the "not found" page holds for a beat, then the void takes it.
   A visitor who has already answered goes straight through to the room.
   ===================================================================== */
console.log('%c* WHY ARE YOU LOOKING HERE?', 'color:#ff9bd5; font-family:monospace; font-size:14px;');
console.log('%c* THE MENU PRECEDES THE DEVICE.', 'color:#5a5a5a; font-family:monospace;');

const skipStraightThrough = store.seenIntro && !reconfigure;

setTimeout(()=>{
  document.getElementById('prelude').style.display = 'none';
  if (skipStraightThrough) toRoom();
  else runInterrogation();
}, reduceMotion ? 250 : (skipStraightThrough ? 300 : 850));
</script>

-->
</body>
</html>
