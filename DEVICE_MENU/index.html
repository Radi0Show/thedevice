<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEVICE_MENU</title>
<meta name="description" content="The room the game is played in. Walk to the console and plug in the controller.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE DEVICE">
<meta property="og:title" content="DEVICE_MENU">
<meta property="og:description" content="NO CONTROLLER.">
<meta property="og:url" content="https://shadowcrystal.dev/DEVICE_MENU/">
<meta property="og:image" content="https://shadowcrystal.dev/og/device.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://shadowcrystal.dev/og/device.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family:'Courier New', Courier, monospace;
    font-weight:bold; color:#fff; text-transform:uppercase;
    -webkit-font-smoothing:none; cursor:default;
  }
  #room {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 4 / 3));
    height:min(100vh, calc(100vw * 3 / 4));
    image-rendering:pixelated;
    background:#000;
    transition:opacity .5s linear;
  }
  .cornerlabel { position:fixed; top:14px; left:16px; font-size:12px; color:#2e2e2e; z-index:5; }
  #skip {
    position:fixed; top:12px; right:16px; z-index:5;
    font-size:12px; color:#5a5a5a; text-decoration:none; letter-spacing:.1em;
  }
  #skip:hover, #skip:focus-visible { color:#ffff00; outline:none; }
  #keys {
    position:fixed; bottom:26px; left:0; right:0; z-index:5;
    text-align:center; font-size:11px; color:#2e2e2e; letter-spacing:.08em;
  }
  footer {
    position:fixed; bottom:6px; left:0; right:0; z-index:5;
    text-align:center; font-size:10px; color:#1c1c1c; letter-spacing:.08em;
  }
  footer a { color:#2e2e2e; text-decoration:none; }


  #flash {
    position:fixed; inset:0; background:#fff; opacity:0; z-index:50;
    pointer-events:none; transition:opacity .45s linear;
  }
  #failed {
    display:none; position:fixed; inset:0; z-index:60; background:#000;
    flex-direction:column; align-items:center; justify-content:center; gap:1.4rem;
    font-size:17px; line-height:1.9; text-align:center;
  }
  #failed a { color:#5a5a5a; text-decoration:none; }



  #eyes{
    position:fixed; bottom:14vh; right:9vw; z-index:40;
    display:none; pointer-events:none;
  }
  #eyes span{ display:inline-block; width:7px; height:11px; background:#ff9bd5; }
  #eyes span + span{ margin-left:12px; background:#ffff00; }



  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    #touch.awake { opacity: 1; }
  }
  #touch .pad, #touch .btn {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.06);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #dpad {
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 148px;
    height: 148px;
  }
  #dpad::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 50% 0 / 34% 100% no-repeat,
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 0 50% / 100% 34% no-repeat;
    border-radius: inherit;
  }
  #touch .btn {
    width: 64px;
    height: 64px;
    color: rgba(255, 255, 255, 0.55);
    font: bold 20px/60px ui-monospace, Menlo, monospace;
    text-align: center;
  }
  #touch .btn.down { background: rgba(255, 255, 255, 0.22); }
  #btnZ {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #btnX {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }



  @media (pointer: coarse) and (orientation: landscape) {
    #dpad {
      left: max(12px, env(safe-area-inset-left));
      bottom: auto;
      top: 55%;
      transform: translateY(-50%);
    }
    #btnZ {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
    #btnX {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }
  }
</style>
</head>
<body>


<canvas id="room" width="640" height="480"
        aria-label="A room with a television. Walk Kris to the console with the arrow keys and press Z to plug in the controller."></canvas>


<div id="eyes"><span></span><span></span></div>

<div id="flash"></div>

<div id="touch">
  <div id="dpad" class="pad"></div>
  <div id="btnZ" class="btn">Z</div>
  <div id="btnX" class="btn">X</div>
</div>

<div id="failed">
  <p>* THE ROOM DID NOT LOAD.</p>
  <a href="../">&larr; THE DEVICE</a>
</div>

<script type="module">
  import { runRoom } from '../shared/room.js?v=snd3';
  import { loadPrefs, savePrefs } from '../shared/device.js';

  const canvas = document.getElementById('room');



  function fit() {
    const f = Math.min(innerWidth / 640, innerHeight / 480);
    const cssW = 640 * f;
    const cssH = 480 * f;
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
  }
  addEventListener('resize', fit);
  fit();

  const prefs = loadPrefs();

  try {
    const room = await runRoom(canvas, {
      base: '../assets/room/',
      mantleBase: '../assets/mantle/',
      tvBase: '../assets/tv/',
      soundOn: prefs.soundOn,

      alreadyBooted: prefs.booted === true,
      onBooted: () => {
        if (!prefs.booted) { prefs.booted = true; savePrefs(prefs); }

        room.suspend(true);

      },
    });
  } catch (err) {
    console.error('room failed to load:', err);
    document.getElementById('failed').style.display = 'flex';
  }


  if (prefs.flickerOK && !matchMedia('(prefers-reduced-motion: reduce)').matches
      && Math.random() <= 0.02) {
    setTimeout(() => {
      const e = document.getElementById('eyes');
      e.style.display = 'block';
      setTimeout(() => { e.style.display = 'none'; }, 150);
    }, 6000 + Math.random() * 14000);
  }


  if (Math.random() <= 0.05) {
    setTimeout(() => {
      const old = document.title;
      document.title = '*(do not trust the empty slots.)';
      setTimeout(() => { document.title = old; }, 4000);
    }, 20000);
  }
</script>

<script type="module">

  const touchRoot = document.getElementById('touch');
  const coarse = matchMedia('(pointer: coarse)').matches;
  if (coarse) {
    const kd = (key) => window.dispatchEvent(new KeyboardEvent('keydown', { key }));
    const ku = (key) => window.dispatchEvent(new KeyboardEvent('keyup', { key }));


    let sleepT = 0;
    const wake = () => {
      touchRoot.classList.add('awake');
      clearTimeout(sleepT);
      sleepT = setTimeout(() => touchRoot.classList.remove('awake'), 3200);
    };
    window.addEventListener('pointerdown', wake);
    window.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse') wake(); });


    const pad = document.getElementById('dpad');
    let padDir = null;
    const DIRS = { r: 'ArrowRight', l: 'ArrowLeft', u: 'ArrowUp', d: 'ArrowDown' };
    const aim = (e) => {
      const r = pad.getBoundingClientRect();
      const dx = e.clientX - (r.left + r.width / 2);
      const dy = e.clientY - (r.top + r.height / 2);
      if (Math.hypot(dx, dy) < r.width * 0.12) return padDir;
      return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    };
    const setDir = (dir) => {
      if (dir === padDir) return;
      if (padDir) ku(DIRS[padDir]);
      padDir = dir;
      if (padDir) kd(DIRS[padDir]);
    };
    pad.addEventListener('pointerdown', (e) => {
      pad.setPointerCapture(e.pointerId);
      setDir(aim(e));
      e.preventDefault();
    });
    pad.addEventListener('pointermove', (e) => {
      if (pad.hasPointerCapture(e.pointerId)) setDir(aim(e));
    });
    const drop = (e) => { if (pad.hasPointerCapture?.(e.pointerId)) setDir(null); };
    pad.addEventListener('pointerup', drop);
    pad.addEventListener('pointercancel', drop);


    for (const [id, key] of [['btnZ', 'z'], ['btnX', 'x']]) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', (e) => {
        el.setPointerCapture(e.pointerId);
        el.classList.add('down');
        kd(key);
        e.preventDefault();
      });
      const up = () => { el.classList.remove('down'); ku(key); };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    }
  }
</script>
</body>

</html>
