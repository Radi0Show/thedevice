<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVICE_JEVIL</title>
<meta name="description" content="This device has not been built.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE DEVICE">
<meta property="og:title" content="DEVICE_JEVIL">
<meta property="og:description" content="THIS DEVICE HAS NOT BEEN BUILT.">
<meta property="og:url" content="https://radi0show.github.io/thedevice/DEVICE_JEVIL/">
<meta property="og:image" content="https://radi0show.github.io/thedevice/og/device.png">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../shared/device.css">
</head>
<body>
<!-- The slot exists; what belongs in it has not arrived. This page is
     DEVICE_FAILURE wearing the slot's name — see the spec's routing table.
     When jevil-sim is ready to connect, INTEGRATION.md has the steps. -->
<div class="cornerlabel">DEVICE_FAILURE</div>

<main class="subview">
  <div id="line" class="voiceline" aria-live="polite">* THIS DEVICE HAS NOT BEEN BUILT.
* COME BACK WHEN YOU ARE STRONGER.</div>
  <div class="supportline" id="support">
    * IF YOU WANT TO SEE IT BUILT &mdash; <a href="#" onclick="return false;">[ SUPPORT ]</a>
    <span class="dimmer">(&larr; KO-FI URL GOES HERE)</span>
  </div>
  <a class="backline" href="../">&larr; DEVICE_MENU</a>
</main>

<footer>
  A FAN PROJECT &middot; UNAFFILIATED WITH TOBY FOX<br>
  DELTARUNE &copy; TOBY FOX &middot;
  <a href="https://deltarune.com" rel="noopener">SUPPORT THE OFFICIAL RELEASE</a>
</footer>

<script type="module">
  import { applyPrefs, reduceMotion, typeInto, beat } from '../shared/device.js';
  applyPrefs();
  const el = document.getElementById('line');
  const support = document.getElementById('support');
  if (!reduceMotion) {
    (async () => {
      support.style.display = 'none';
      el.textContent = '';
      await typeInto(el, '* THIS DEVICE HAS NOT BEEN BUILT.');
      await beat(500);
      el.textContent += '\n* COME BACK WHEN YOU ARE STRONGER.';
      support.style.display = 'block';
    })();
  }
</script>
</body>
</html>
