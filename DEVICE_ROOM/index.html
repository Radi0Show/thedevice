<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEVICE_ROOM</title>
<meta name="description" content="The room the game is played in. Walk to the console and plug in the controller.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="THE DEVICE">
<meta property="og:title" content="DEVICE_ROOM">
<meta property="og:description" content="NO CONTROLLER.">
<meta property="og:url" content="https://radi0show.github.io/thedevice/DEVICE_ROOM/">
<meta property="og:image" content="https://radi0show.github.io/thedevice/og/device.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://radi0show.github.io/thedevice/og/device.png">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family:'Courier New', Courier, monospace;
    font-weight:bold; color:#fff; text-transform:uppercase;
    -webkit-font-smoothing:none; cursor:default;
  }
  #room {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(100vw, calc(100vh * 4 / 3));
    height:min(100vh, calc(100vw * 3 / 4));
    image-rendering:pixelated;
    background:#000;
    transition:opacity .5s linear;
  }
  .cornerlabel { position:fixed; top:14px; left:16px; font-size:12px; color:#2e2e2e; z-index:5; }
  #skip {
    position:fixed; top:12px; right:16px; z-index:5;
    font-size:12px; color:#5a5a5a; text-decoration:none; letter-spacing:.1em;
  }
  #skip:hover, #skip:focus-visible { color:#ffff00; outline:none; }
  #keys {
    position:fixed; bottom:26px; left:0; right:0; z-index:5;
    text-align:center; font-size:11px; color:#2e2e2e; letter-spacing:.08em;
  }
  footer {
    position:fixed; bottom:6px; left:0; right:0; z-index:5;
    text-align:center; font-size:10px; color:#1c1c1c; letter-spacing:.08em;
  }
  footer a { color:#2e2e2e; text-decoration:none; }
  /* The hand-off: the room whites out into the site the way the console
     hands over to what it booted. */
  #flash {
    position:fixed; inset:0; background:#fff; opacity:0; z-index:50;
    pointer-events:none; transition:opacity .45s linear;
  }
  #failed {
    display:none; position:fixed; inset:0; z-index:60; background:#000;
    flex-direction:column; align-items:center; justify-content:center; gap:1.4rem;
    font-size:17px; line-height:1.9; text-align:center;
  }
  #failed a { color:#5a5a5a; text-decoration:none; }

  /* ---------- THE FRIEND (rare; unexplained; never mentioned) ----------
     It used to watch the menu. A dark room suits it better. */
  #eyes{
    position:fixed; bottom:14vh; right:9vw; z-index:40;
    display:none; pointer-events:none;
  }
  #eyes span{ display:inline-block; width:7px; height:11px; background:#ff9bd5; }
  #eyes span + span{ margin-left:12px; background:#ffff00; }
</style>
</head>
<body>
<!-- The corner label, SKIP link, key legend and footer are gone from this
     page by request — the room is bare, like the boot. The attribution
     footer still ships on the sims' and the other device pages. -->

<canvas id="room" width="640" height="480"
        aria-label="A room with a television. Walk Kris to the console with the arrow keys and press Z to plug in the controller."></canvas>


<div id="eyes"><span></span><span></span></div>

<div id="flash"></div>
<div id="failed">
  <p>* THE ROOM DID NOT LOAD.</p>
  <a href="../">&larr; THE DEVICE</a>
</div>

<script type="module">
  import { runRoom } from '../shared/room.js?v=vessel4';
  import { loadPrefs, savePrefs } from '../shared/device.js';

  const canvas = document.getElementById('room');

  /* FILL THE DISPLAY, BARS ON THE SHORT AXIS — what the game does in
     fullscreen. The frame keeps its 4:3 and grows until one axis runs out,
     so a widescreen gets black down either side and nothing is cropped.

     This deliberately gives up whole-pixel scaling. At a fractional factor
     `image-rendering: pixelated` hands some source columns n device pixels
     and their neighbours n + 1, so a one-pixel stem is fat on one letter
     and thin on the next. The real game makes the same trade at the same
     place: filling the screen wins over an exact pixel grid. */
  function fit() {
    const f = Math.min(innerWidth / 640, innerHeight / 480);
    const cssW = 640 * f;
    const cssH = 480 * f;
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
  }
  addEventListener('resize', fit);
  fit();

  const prefs = loadPrefs();

  try {
    const room = await runRoom(canvas, {
      base: '../assets/room/',
      mantleBase: '../assets/mantle/',
      tvBase: '../assets/tv/',
      soundOn: prefs.soundOn,
      // Once you have booted it once, the set is on when you walk in.
      alreadyBooted: prefs.booted === true,
      onBooted: () => {
        if (!prefs.booted) { prefs.booted = true; savePrefs(prefs); }
        // THE BOARD COMES UP IN THE TELEVISION — painted by the room, in the
        // board's own blue and its own font. Kris stays in front of it and
        // stops walking, because the board has the keys now.
        room.suspend(true);
        // the #keys legend is gone from this page — the board teaches its
        // own controls
      },
    });
  } catch (err) {
    console.error('room failed to load:', err);
    document.getElementById('failed').style.display = 'flex';
  }

  /* ---------------- the friend (rare, gated, once) ---------------- */
  if (prefs.flickerOK && !matchMedia('(prefers-reduced-motion: reduce)').matches
      && Math.random() <= 0.02) {
    setTimeout(() => {
      const e = document.getElementById('eyes');
      e.style.display = 'block';
      setTimeout(() => { e.style.display = 'none'; }, 150);
    }, 6000 + Math.random() * 14000);
  }

  /* ---------------- rare tab whisper ---------------- */
  if (Math.random() <= 0.05) {
    setTimeout(() => {
      const old = document.title;
      document.title = '*(do not trust the empty slots.)';
      setTimeout(() => { document.title = old; }, 4000);
    }, 20000);
  }
</script>
</body>
</html>
