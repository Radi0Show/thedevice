<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BlackKnife">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Black Knife Simulator</title>
<style>


  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #ccc;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;


    touch-action: none;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }


  #game {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 4 / 3));
    height: min(100vh, calc(100vw * 3 / 4));
    background: #000;

    image-rendering: pixelated;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
  }


  #credit {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 4px 8px;
    text-align: center;
    font-size: 11px;
    color: #555;
    pointer-events: none;
    user-select: none;
  }


  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: block;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
  }
  #touch .pad, #touch .btn {
    position: absolute;
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.06);


    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #dpad {
    left: max(18px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 148px;
    height: 148px;
  }

  #dpad::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 50% 0 / 34% 100% no-repeat,
      linear-gradient(rgba(255,255,255,0.14), rgba(255,255,255,0.14)) 0 50% / 100% 34% no-repeat;
    border-radius: inherit;
  }
  #touch .btn {
    width: 64px;
    height: 64px;
    color: rgba(255, 255, 255, 0.55);
    font: bold 20px/60px ui-monospace, Menlo, monospace;
    text-align: center;
  }
  #touch .btn.down { background: rgba(255, 255, 255, 0.22); }
  #btnZ {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #btnX {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }


  #touch.swap #btnZ {
    right: calc(max(20px, env(safe-area-inset-right)) + 74px);
    bottom: max(18px, env(safe-area-inset-bottom));
  }
  #touch.swap #btnX {
    right: max(20px, env(safe-area-inset-right));
    bottom: calc(max(18px, env(safe-area-inset-bottom)) + 74px);
  }
  #touch #btnR {
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    width: 44px;
    height: 44px;
    font-size: 15px;
    line-height: 40px;
  }


  @media (pointer: coarse) and (orientation: landscape) {


    #credit {
      bottom: auto;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: auto;
      text-align: left;
    }
    #dpad {
      left: max(12px, env(safe-area-inset-left));
      bottom: auto;
      top: 55%;
      transform: translateY(-50%);
    }
    #btnZ {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
    #btnX {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }


    #touch.swap #btnZ {
      right: calc(max(16px, env(safe-area-inset-right)) + 40px);
      bottom: auto;
      top: calc(55% + 30px);
      transform: translateY(-50%);
    }
    #touch.swap #btnX {
      right: max(16px, env(safe-area-inset-right));
      bottom: auto;
      top: calc(55% - 58px);
      transform: translateY(-50%);
    }
  }
</style>
</head>
<body>
  <canvas id="game" width="640" height="480"></canvas>
  <p id="credit">Game is by Toby Fox and the Deltarune Team</p>
  <div id="touch">
    <div id="dpad" class="pad"></div>
    <div id="btnZ" class="btn">Z</div>
    <div id="btnX" class="btn">X</div>
    <div id="btnR" class="btn">R</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
